    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M395 169c-31-48-75-72-132-72-92 0-166 75-166 168s74 168 166 168c56 0 100-22 132-65" stroke="url(#mc-flow)" stroke-width="26"/>
