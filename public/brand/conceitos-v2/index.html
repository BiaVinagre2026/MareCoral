<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maré Coral — conceitos de logo v2</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Montserrat, Arial, sans-serif;
        color: #FD3774;
        background:
          radial-gradient(circle at 18% 12%, rgba(253, 93, 42, .16), transparent 34%),
          radial-gradient(circle at 86% 88%, rgba(253, 55, 116, .16), transparent 38%),
          rgba(253, 55, 116, .035);
      }
      main { max-width: 1440px; margin: 0 auto; padding: 52px; }
      header { text-align: center; margin-bottom: 34px; }
      h1 { margin: 0 0 8px; font-size: 42px; color: #FD5D2A; }
      header p { margin: 0; font-size: 18px; font-weight: 700; }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
      article {
        min-height: 535px;
        padding: 24px;
        border: 2px solid rgba(253, 55, 116, .24);
        border-radius: 34px;
        background: linear-gradient(145deg, rgba(253, 93, 42, .035), rgba(253, 55, 116, .065));
      }
      .label { display: flex; align-items: center; gap: 13px; font-size: 21px; font-weight: 800; }
      .number {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 50%;
        color: rgba(253, 55, 116, .96);
        border: 3px solid #FD5D2A;
      }
      article img { display: block; width: 100%; height: 430px; object-fit: contain; }
      @media (max-width: 900px) {
        main { padding: 24px; }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Maré Coral Fitwear</h1>
        <p>4 caminhos em coral + rosa · fundo transparente</p>
      </header>
      <section class="grid">
        <article>
          <div class="label"><span class="number">1</span> Sol e Maré</div>
          <img src="./opcao-01-sol-e-mare.svg" alt="Opção 1 — Sol e Maré" />
        </article>
        <article>
          <div class="label"><span class="number">2</span> Monograma MC</div>
          <img src="./opcao-02-monograma-mc.svg" alt="Opção 2 — Monograma MC" />
        </article>
        <article>
          <div class="label"><span class="number">3</span> Onda em Movimento</div>
          <img src="./opcao-03-onda-em-movimento.svg" alt="Opção 3 — Onda em Movimento" />
        </article>
        <article>
          <div class="label"><span class="number">4</span> Quatro Ritmos</div>
          <img src="./opcao-04-quatro-ritmos.svg" alt="Opção 4 — Quatro Ritmos" />
        </article>
      </section>
    </main>
  </body>
</html>
