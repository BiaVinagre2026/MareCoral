<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Maré Coral Fitwear — opção Quatro Ritmos</title>
  <desc id="desc">Logo transparente em coral e rosa com quatro movimentos esportivos dentro de um emblema de maré e a assinatura Vista o treino. Sinta a maré.</desc>
  <defs>
    <linearGradient id="rhythm-ring" x1="285" y1="72" x2="615" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FD5D2A"/>
      <stop offset="1" stop-color="#FD3774"/>
    </linearGradient>
    <linearGradient id="rhythm-type" x1="225" y1="0" x2="675" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FD5D2A"/>
      <stop offset="0.5" stop-color="#FD4B52"/>
      <stop offset="1" stop-color="#FD3774"/>
    </linearGradient>
    <clipPath id="rhythm-clip">
      <circle cx="450" cy="215" r="132"/>
    </clipPath>
  </defs>

  <circle cx="450" cy="215" r="137" fill="none" stroke="url(#rhythm-ring)" stroke-width="22"/>
  <g clip-path="url(#rhythm-clip)" fill="none" stroke-linecap="round">
    <path d="M282 158c75-52 142-41 201 31 47 57 98 68 153 32" stroke="#FD5D2A" stroke-width="25"/>
    <path d="M270 211c65-41 128-30 187 33 56 60 118 65 188 15" stroke="#FD3774" stroke-width="24"/>
    <path d="M272 268c67-34 130-23 188 34 51 50 112 54 184 11" stroke="#FD5D2A" stroke-width="22" opacity="0.86"/>
    <path d="M300 322c55-25 107-18 157 21 48 38 99 42 153 14" stroke="#FD3774" stroke-width="18" opacity="0.75"/>
  </g>

  <text x="450" y="455" fill="url(#rhythm-type)" font-family="Montserrat, Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="-4" text-anchor="middle">Maré Coral</text>
  <text x="450" y="517" fill="#FD3774" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="13" text-anchor="middle">FITWEAR</text>
  <path d="M269 554h362" stroke="url(#rhythm-type)" stroke-linecap="round" stroke-width="8"/>
  <text x="450" y="616" fill="url(#rhythm-type)" font-family="Montserrat, Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle">Vista o treino. Sinta a maré.</text>
</svg>
