name: marecoral

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: marecoral-web-dev
    ports:
      - "127.0.0.1:${MARE_CORAL_WEB_PORT:-4310}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_WHATSAPP_URL: "${VITE_WHATSAPP_URL:-}"
    volumes:
      - .:/app
      - marecoral_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  marecoral_node_modules:
